# Loki en un solo nodo con almacenamiento en disco: suficiente para desarrollo y la demo.
# Recibe logs por OTLP desde el Collector (http://loki:3100/otlp). En producción: Loki con
# almacenamiento en objetos (S3/GCS) o un servicio administrado.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: indice_
        period: 24h

limits_config:
  allow_structured_metadata: true   # trace_id, span_id y severidad llegan como metadatos del log (OTLP)
  retention_period: 168h            # 7 días, igual que los tópicos de Kafka

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
