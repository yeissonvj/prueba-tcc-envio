global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # Métricas de las tres aplicaciones (vía OpenTelemetry Collector).
  - job_name: aplicaciones
    static_configs:
      - targets: ["otel-collector:8889"]

  # Lag de los grupos de consumo: la señal con la que se escalan procesador y notificador (KEDA).
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
