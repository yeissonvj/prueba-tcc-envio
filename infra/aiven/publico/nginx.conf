# Puerta pública de la demo (perfil "publico", detrás de ngrok).
# Expone SOLO la API y el endpoint de tokens de Keycloak; la consola de administración y el resto de Keycloak quedan fuera.
server {
    listen 80;
    client_max_body_size 64k;

    # API de ingesta y consulta
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /salud/ {
        proxy_pass http://api:8080;
    }

    # Solo la emisión de tokens (client credentials). El emisor del token sigue siendo KC_HOSTNAME,
    # así que la API lo valida igual que en local.
    location = /realms/tcc/protocol/openid-connect/token {
        limit_except POST { deny all; }
        proxy_pass http://keycloak:8081;
        proxy_set_header Host localhost:8081;
    }

    location / {
        return 404;
    }
}
