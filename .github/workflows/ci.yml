# Pipeline de la Fase 1.8: calidad → seguridad → imágenes → humo → staging → producción (aprobación manual).
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]   # develop: calidad, seguridad, imágenes y humo; publicar y desplegar solo desde main
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: solo lectura por defecto; cada job pide lo que necesita.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  calidad:
    name: Compilación y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json

      - name: Restaurar
        run: dotnet restore dotnet/TccEventos.slnx

      - name: Compilar (avisos = errores)
        run: dotnet build dotnet/TccEventos.slnx --no-restore -c Release -warnaserror

      # Incluye contrato OpenAPI, arquitectura e integración con Testcontainers (el runner trae Docker).
      - name: Pruebas
        run: >
          dotnet test dotnet/TccEventos.slnx --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory resultados --logger trx

      - name: Resumen de cobertura
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: resultados/**/coverage.cobertura.xml
          targetdir: cobertura
          reporttypes: MarkdownSummaryGithub

      - name: Publicar resumen
        if: always()
        run: cat cobertura/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: resultados

  seguridad:
    name: Dependencias y configuración
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json

      - name: Paquetes NuGet con vulnerabilidades conocidas
        run: |
          dotnet restore dotnet/TccEventos.slnx
          dotnet list dotnet/TccEventos.slnx package --vulnerable --include-transitive | tee vulnerables.txt
          if grep -q "has the following vulnerable packages" vulnerables.txt; then
            echo "::error::Hay paquetes con vulnerabilidades conocidas"; exit 1
          fi

      - name: Trivy · Dockerfile, Compose y secretos
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  imagenes:
    name: Imagen ${{ matrix.servicio.nombre }}
    needs: [calidad, seguridad]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # solo este job puede publicar en GHCR
    strategy:
      matrix:
        servicio:
          - { nombre: tcc-api,         proyecto: TccEventos.Api,         base: aspnet }
          - { nombre: tcc-procesador,  proyecto: TccEventos.Procesador,  base: runtime }
          - { nombre: tcc-notificador, proyecto: TccEventos.Notificador, base: runtime }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: dotnet
          build-args: |
            PROYECTO=${{ matrix.servicio.proyecto }}
            BASE=${{ matrix.servicio.base }}
          tags: ${{ matrix.servicio.nombre }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.servicio.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio.nombre }}

      - name: Trivy · vulnerabilidades de la imagen
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ matrix.servicio.nombre }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Guardar imagen para la prueba de humo
        run: docker save ${{ matrix.servicio.nombre }}:ci | gzip > ${{ matrix.servicio.nombre }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: imagen-${{ matrix.servicio.nombre }}
          path: ${{ matrix.servicio.nombre }}.tar.gz
          retention-days: 3

      - name: Publicar en GHCR (solo main)
        if: env.PUBLICAR == 'true'
        env:
          REGISTRO: ghcr.io/${{ github.repository_owner }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          destino="${REGISTRO,,}/${{ matrix.servicio.nombre }}"
          for etiqueta in "${{ github.sha }}" latest; do
            docker tag "${{ matrix.servicio.nombre }}:ci" "$destino:$etiqueta"
            docker push "$destino:$etiqueta"
          done

  humo:
    name: Humo · sistema completo con las imágenes construidas
    needs: imagenes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: imagen-*
          merge-multiple: true
      - name: Cargar imágenes
        run: for imagen in *.tar.gz; do gunzip -c "$imagen" | docker load; done

      - name: Levantar infraestructura y aplicaciones
        env:
          IMAGEN_API: tcc-api:ci
          IMAGEN_PROCESADOR: tcc-procesador:ci
          IMAGEN_NOTIFICADOR: tcc-notificador:ci
        run: docker compose -f infra/docker-compose.yml --profile aplicaciones up -d --no-build --wait-timeout 300 api procesador notificador

      - name: Prueba de humo
        run: API=http://localhost:8090 ./infra/pruebas/humo.sh

      - name: Logs si falla
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile aplicaciones logs --tail 200

  despliegue-staging:
    name: Staging
    needs: humo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      # Sin clúster en esta prueba técnica: el paso real sería un "helm upgrade" con la imagen del commit.
      - run: echo "helm upgrade --install tcc-eventos ./despliegue --set imagen.etiqueta=${{ github.sha }} (staging)"

  despliegue-produccion:
    name: Producción (canary)
    needs: despliegue-staging
    runs-on: ubuntu-24.04
    environment: produccion   # regla de protección del entorno: aprobación manual obligatoria
    steps:
      - name: Congelamiento de temporada pico (15-nov a 10-ene)
        env:
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          hoy=$((10#$(TZ=America/Bogota date +%m%d)))   # MMDD como número en base 10 (0110 no es octal)
          if (( hoy >= 1115 || hoy <= 110 )) && [[ "$MENSAJE" != *"[hotfix]"* ]]; then
            echo "::error::Despliegues congelados por temporada pico. Solo cambios marcados [hotfix] con aprobación."
            exit 1
          fi
      - run: echo "Canary 10 % → 100 % con rollback automático por errores, lag o latencia (Argo Rollouts / Flagger)."
